<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Setu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%2316233D%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-visual">
    <a href="/index.html" class="brand">
      <svg class="mark" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#F5E9CB"/><circle cx="35" cy="35" r="9" fill="#16233D"/><circle cx="65" cy="65" r="9" fill="#16233D"/><line x1="35" y1="35" x2="65" y2="65" stroke="#16233D" stroke-width="4"/></svg>
      Setu
    </a>
    <div>
      <h2 style="color:#FCFBF8; font-size: var(--fs-2xl); max-width: 11ch;">Welcome back to the network.</h2>
      <p style="color: var(--ink-200); max-width: 40ch;">Log in to reach mentors, opportunities, and events built by your own campus community.</p>
    </div>
    <div style="color:var(--ink-400); font-size: var(--fs-xs);">Setu — Student–Alumni Connection Platform</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-box">
      <h1 style="font-size: var(--fs-xl);">Log in</h1>
      <p style="color: var(--ink-600); margin-bottom: var(--sp-4);">New here? <a href="/register.html" style="color: var(--brass-700); font-weight:600; text-decoration:none;">Create an account</a></p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" type="email" id="email" required placeholder="you@campus.edu">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-brass btn-block" id="loginBtn">Log in</button>
      </form>

      <div class="card" style="margin-top: var(--sp-4); background: var(--paper-50);">
        <div style="font-size: var(--fs-xs); color: var(--ink-600);">
          <strong style="color: var(--ink-800);">Admin demo login</strong><br>
          Email: <code>admin@campus.edu</code> · Password: <code>Admin@123</code>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true; btn.textContent = 'Logging in...';
    try {
      const data = await api.post('/auth/login', { email, password });
      setSession(data.token, data.user);
      toast('Welcome back, ' + data.user.name + '!');
      setTimeout(() => { window.location.href = `/${data.user.role}-dashboard.html`; }, 400);
    } catch (err) {
      toast(err.message, 'error');
      btn.disabled = false; btn.textContent = 'Log in';
    }
  });

  // If already logged in, go straight to dashboard
  (function redirectIfLoggedIn() {
    const user = getUser();
    if (user && getToken()) window.location.href = `/${user.role}-dashboard.html`;
  })();
</script>
</body>
</html>
